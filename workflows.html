<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERW Pipeline — Workflow Viewer</title>
<style>
  :root {
    --bg: #fafaf7;
    --fg: #1a1a1a;
    --muted: #6a6a6a;
    --border: #e5e3dc;
    --card: #fff;
    --hover: #f4f3ee;
    --data:    #5a7a8a;
    --package: #7e57c2;
    --lime:    #2c8a4b;
    --erw:     #c97a17;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0 0 3px; font-size: 18px; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .source-tag { font-size: 11px; color: #aaa; margin-left: 8px; }

  .layout {
    display: grid;
    grid-template-columns: 290px 1fr;
    height: calc(100vh - 64px);
    min-height: 600px;
  }

  .sidebar {
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar h2 {
    margin: 0 0 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .flow-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent, #ccc);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: background 0.12s;
  }
  .flow-btn:hover { background: var(--hover); }
  .flow-btn.active {
    background: var(--hover);
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }
  .flow-btn .name { font-weight: 600; margin-bottom: 3px; }
  .flow-btn .desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

  .main { display: grid; grid-template-rows: 1fr auto; min-width: 0; }
  .graph-wrap {
    background: var(--card);
    position: relative;
    overflow: hidden;
  }
  .graph-wrap svg { width: 100%; height: 100%; display: block; }

  .legend {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    backdrop-filter: blur(4px);
  }
  .legend .item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend .swatch {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .controls {
    position: absolute; top: 12px; left: 12px;
    display: flex; gap: 6px;
  }
  .ctrl {
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 11px;
    cursor: pointer;
    color: var(--muted);
  }
  .ctrl:hover { background: #fff; color: var(--fg); }

  .steps {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 14px 22px 22px;
    max-height: 42vh;
    overflow-y: auto;
  }
  .steps-empty {
    color: var(--muted);
    font-style: italic;
    padding: 6px 0;
  }
  .steps-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .steps-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .steps-count { font-size: 11px; color: var(--muted); }

  .step {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 12px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    cursor: default;
    border-radius: 4px;
  }
  .step:last-child { border-bottom: 0; }
  .step:hover { background: var(--hover); }
  .step .num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--step-color, #888);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 600;
    align-self: start;
    margin-top: 2px;
  }
  .step .body { min-width: 0; }
  .step .from-to {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .step .from-to b { color: var(--fg); }
  .step .from-to .arrow { margin: 0 6px; opacity: 0.6; }
  .step .passes {
    font-size: 13px;
  }
  .step .note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* svg styling */
  .node { cursor: grab; }
  .node:active { cursor: grabbing; }
  .node circle { stroke-width: 2; transition: opacity 0.15s, stroke-width 0.15s; }
  .node text { font-size: 10px; pointer-events: none; user-select: none; fill: #333; }
  .node.dim circle { opacity: 0.18; }
  .node.dim text { opacity: 0.32; }
  .node.flash circle { stroke-width: 4; }

  .edge { fill: none; transition: opacity 0.15s, stroke-width 0.15s; }
  .edge.bg { stroke: #c5c2b8; stroke-width: 1; opacity: 0.45; }
  .edge.bg.dim { opacity: 0.07; }
  .edge.active { stroke-width: 2.2; opacity: 0.95; }
  .edge.flash { stroke-width: 3.5; }

  .badge-circle { stroke: #fff; stroke-width: 1.5; cursor: default; }
  .badge-text {
    font-size: 10px;
    font-weight: 700;
    fill: #fff;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
    dominant-baseline: central;
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { max-height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="doc-title">…</h1>
  <div class="sub"><span id="doc-sub"></span><span class="source-tag" id="src-tag"></span></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Workflows</h2>
    <div id="flow-list"></div>
    <h2 style="margin-top:18px">Components</h2>
    <div id="component-summary" style="font-size:11px;color:var(--muted);line-height:1.6"></div>
  </aside>

  <main class="main">
    <div class="graph-wrap">
      <svg id="graph" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="controls">
        <button class="ctrl" id="btn-reheat">Re-layout</button>
        <button class="ctrl" id="btn-clear" style="display:none">Clear selection</button>
      </div>
      <div class="legend">
        <div class="item"><span class="swatch" style="background:var(--data)"></span> External data</div>
        <div class="item"><span class="swatch" style="background:var(--package)"></span> R package</div>
        <div class="item"><span class="swatch" style="background:var(--erw)"></span> ERW stage</div>
      </div>
    </div>
    <div class="steps" id="steps">
      <div class="steps-empty">Select a workflow on the left to highlight its path through the components.</div>
    </div>
  </main>
</div>

<script type="application/json" id="embedded-data">

    {"id":"erw-1","name":"SoilGrids layers","kind":"stage","group":"erw","file":"erw/erw-1-layers-soilgrids.R","description":"Build SSA mask, pull SoilGrids variables, derive ECEC + acidity saturation, mask to cropland."},

    {"id":"erw-basalt-access","name":"Basalt access","kind":"stage","group":"erw","file":"erw/erw-basalt-access.R","description":"Delivered basalt price ($/t) and transport-km per pixel via cost-distance."},

    {"id":"erw-profit","name":"Build the ERW profitability map","color":"#c97a17","description":"End-to-end ERW workflow with decomposed costs, per-country energy economics, pedogenic-carbonate deduction, and time-resolved CDR.",
     "steps":[

      {"from":"ext-soilgrids","to":"erw-1","passes":"pH, BLKD, exch acidity, K/Ca/Mg/Na bases at 5/15/30 cm","note":"Depth-weighted average; ECEC and acidity sat derived."},

      {"from":"ext-ecocrop-xlsx","to":"erw-4","passes":"Per-crop acidity-saturation tolerances","note":"Combined with hard-coded pH min/max into CSVs."},
      {"from":"erw-4","to":"erw-5","passes":"ecocrop_parameters_{ph,hp}.csv","note":"Tolerances feed the Recocrop model per crop."},

      {"from":"erw-5","to":"pkg-recocrop","passes":"Crop params + soil rasters","note":"Recocrop::ecocrop builds, predict() applies the response curves."},
      {"from":"pkg-recocrop","to":"erw-5","passes":"Per-crop relative-yield rasters","note":"Clamped [0.2, 1]. 23 crops x 2 responses = 46 rasters."},

      {"from":"ext-gadm","to":"erw-energy-country","passes":"GADM polygons + ISO codes","note":"Rasterised to country code via the working grid."},
      {"from":"ext-energy-table","to":"erw-energy-country","passes":"Electricity price + grid CI per ISO3 (Ember/IEA/AfDB)","note":"43 SSA countries: $0.05–0.40/kWh, 0.03–0.95 kg CO2/kWh."},
      {"from":"erw-energy-country","to":"erw-7","passes":"electricity_usd_kWh + grid_CI_kg_per_kWh rasters","note":"Drives spatial grinding cost AND grinding LCA."},

     "steps":[
      {"from":"ext-trial-data","to":"erw-yield-fit","passes":"Trial-level observations: site, crop, rate, grain, MAT, MAP, pH, log_y_ratio, sd","note":"~15 published data points."},
      {"from":"erw-yield-fit","to":"pkg-brms","passes":"Model formula + weakly-informative priors","note":"Hierarchical model: log_y_ratio ~ log(rate) + s(MAT) + s(MAP) + pH + log(grain) + (1|crop) + (1|site)."},
      {"from":"pkg-brms","to":"erw-yield-fit","passes":"Posterior draws (chains, summaries)","note":"Saved as RDS; small-n dataset → priors dominate."},
      {"from":"erw-yield-fit","to":"erw-yield-predict","passes":"Fitted brmsfit object (RDS)","note":"Predict step loads and applies it to per-pixel covariates."},
      {"from":"erw-1","to":"erw-yield-predict","passes":"Soil pH raster","note":"Baseline pH covariate."},
      {"from":"ext-worldclim","to":"erw-yield-predict","passes":"MAT + MAP rasters","note":"Climate covariates per pixel."},
      {"from":"erw-3","to":"erw-yield-predict","passes":"basalt rates + grain size","note":"Rate and grain size at which yield-uplift is being predicted."},
      {"from":"erw-yield-predict","to":"erw-yield-predict","passes":"posterior_epred → per-crop yield-uplift raster","note":"Median + 5th/95th percentile rasters written per crop."},
      {"from":"erw-yield-predict","to":"erw-7","passes":"erw_yield_uplift_{crop}.tif (when present)","note":"erw-7 uses these in place of EcoCrop response when detected."}
    ]}
  ]
}
</script>

<script>
(async function () {
  // --- load data ----------------------------------------------------------
  let data, source = "embedded";
  try {
    const r = await fetch("workflows.json", { cache: "no-store" });
    if (r.ok) { data = await r.json(); source = "workflows.json"; }
    else throw 0;
  } catch (e) {
    try {
      data = JSON.parse(document.getElementById("embedded-data").textContent);
    } catch (ee) {
      document.body.innerHTML = '<pre style="padding:30px">Failed to load workflows data.</pre>';
      return;
    }
  }

  document.getElementById("doc-title").textContent = data.title || "Workflows";
  document.getElementById("doc-sub").textContent = data.subtitle || "";
  document.getElementById("src-tag").textContent = "(" + source + ")";

  // --- model --------------------------------------------------------------
  const nodes = data.components.map(c => Object.assign({}, c));
  const idMap = new Map(nodes.map(n => [n.id, n]));

  // derive edges: union of all flow steps (skip self-loops here, render specially)
  const edgeKey = (a, b) => a + ">" + b;
  const edgeIndex = new Map();
  data.flows.forEach(f => f.steps.forEach(s => {
    if (!idMap.has(s.from) || !idMap.has(s.to)) return;
    if (s.from === s.to) return;
    const k = edgeKey(s.from, s.to);
    if (!edgeIndex.has(k)) edgeIndex.set(k, { from: s.from, to: s.to });
  }));
  const edges = Array.from(edgeIndex.values());

  // --- layout: force-directed --------------------------------------------
  const W = 1000, H = 640;
  const colorOf = n => {
    if (n.kind === "external") return "var(--data)";
    if (n.kind === "package")  return "var(--package)";
    if (n.group === "lime")    return "var(--lime)";
    if (n.group === "erw")     return "var(--erw)";
    return "#777";
  };
  const radiusOf = n => n.kind === "stage" ? 13 : n.kind === "package" ? 10 : 9;

  function seedPositions() {
    // initial X bias by kind/group to give the simulation a head start
    const groupX = n => {
      if (n.kind === "external") return 130;
      if (n.kind === "package")  return 360;
      if (n.group === "lime")    return 620;
      if (n.group === "erw")     return 880;
      return W / 2;
    };
    nodes.forEach((n, i) => {
      n.x = groupX(n) + (Math.random() - 0.5) * 90;
      n.y = 60 + (i % 12) * (H - 120) / 12 + (Math.random() - 0.5) * 60;
      n.vx = 0; n.vy = 0;
      n.r = radiusOf(n);
      n.fixed = false;
    });
  }

  const REPULSION = 3500;
  const SPRING_K  = 0.045;
  const SPRING_L  = 105;
  const CENTER_K  = 0.006;
  const DAMPING   = 0.84;
  const PADDING   = 50;

  function tick() {
    for (const n of nodes) { n.fx = 0; n.fy = 0; }
    // pairwise repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 0.5) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const d  = Math.sqrt(d2);
        const f  = REPULSION / d2;
        const fx = f * dx / d, fy = f * dy / d;
        a.fx -= fx; a.fy -= fy;
        b.fx += fx; b.fy += fy;
      }
    }
    // spring along edges
    for (const e of edges) {
      const a = idMap.get(e.from), b = idMap.get(e.to);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.sqrt(dx*dx + dy*dy) || 1;
      const f  = SPRING_K * (d - SPRING_L);
      const fx = f * dx / d, fy = f * dy / d;
      a.fx += fx; a.fy += fy;
      b.fx -= fx; b.fy -= fy;
    }
    // weak center attraction
    for (const n of nodes) {
      n.fx += (W/2 - n.x) * CENTER_K;
      n.fy += (H/2 - n.y) * CENTER_K * 1.3;
    }
    // integrate
    for (const n of nodes) {
      if (n.fixed) continue;
      n.vx = (n.vx + n.fx) * DAMPING;
      n.vy = (n.vy + n.fy) * DAMPING;
      n.x = Math.max(PADDING, Math.min(W - PADDING, n.x + n.vx));
      n.y = Math.max(PADDING, Math.min(H - PADDING - 20, n.y + n.vy));
    }
  }

  function runSim(iterations) {
    for (let i = 0; i < iterations; i++) tick();
  }

  seedPositions();
  runSim(450);

  // --- SVG ----------------------------------------------------------------
  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("graph");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  function el(name, attrs) {
    const e = document.createElementNS(SVGNS, name);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // arrowhead markers (regular + active variants per flow color baked in via currentColor)
  const defs = el("defs");
  defs.innerHTML =
    '<marker id="arr-bg"  viewBox="0 -5 10 10" refX="18" refY="0" markerWidth="6" markerHeight="6" orient="auto">'
    +  '<path d="M0,-5L10,0L0,5" fill="#a8a59a"/></marker>'
    +'<marker id="arr-on" viewBox="0 -5 10 10" refX="18" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'
    +  '<path d="M0,-5L10,0L0,5" fill="context-stroke"/></marker>';
  svg.appendChild(defs);

  const gEdges  = el("g", {id: "g-edges"});
  const gBadges = el("g", {id: "g-badges"});
  const gNodes  = el("g", {id: "g-nodes"});
  svg.appendChild(gEdges);
  svg.appendChild(gBadges);
  svg.appendChild(gNodes);

  // --- render -------------------------------------------------------------
  let selectedFlow = null;
  let stepEdgeMap = new Map();      // "from>to" -> [stepNums]
  let activeNodeSet = new Set();
  let selfStepMap = new Map();      // nodeId -> [stepNums]

  function buildStepEdges(flow) {
    stepEdgeMap = new Map();
    activeNodeSet = new Set();
    selfStepMap = new Map();
    if (!flow) return;
    flow.steps.forEach((s, i) => {
      activeNodeSet.add(s.from);
      activeNodeSet.add(s.to);
      if (s.from === s.to) {
        if (!selfStepMap.has(s.from)) selfStepMap.set(s.from, []);
        selfStepMap.get(s.from).push(i + 1);
      } else {
        const k = edgeKey(s.from, s.to);
        if (!stepEdgeMap.has(k)) stepEdgeMap.set(k, []);
        stepEdgeMap.get(k).push(i + 1);
      }
    });
  }

  function renderEdges() {
    gEdges.innerHTML = "";
    const dim = selectedFlow != null;
    for (const e of edges) {
      const a = idMap.get(e.from), b = idMap.get(e.to);
      const k = edgeKey(e.from, e.to);
      const isActive = stepEdgeMap.has(k);
      const line = el("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        "marker-end": isActive ? "url(#arr-on)" : "url(#arr-bg)",
        class: isActive ? "edge active" : ("edge bg" + (dim ? " dim" : "")),
        stroke: isActive ? (selectedFlow.color || "#333") : "#a8a59a",
        "data-key": k
      });
      gEdges.appendChild(line);
    }
  }

  function renderNodes() {
    gNodes.innerHTML = "";
    const dim = selectedFlow != null;
    for (const n of nodes) {
      const isActive = !dim || activeNodeSet.has(n.id);
      const g = el("g", {
        class: "node" + (dim && !isActive ? " dim" : ""),
        transform: `translate(${n.x.toFixed(1)}, ${n.y.toFixed(1)})`,
        "data-id": n.id
      });
      const c = el("circle", {
        r: n.r,
        fill: "#fff",
        stroke: getCSSVar(colorOf(n))
      });
      // fill tint
      c.style.fill = hexFromVar(colorOf(n)) + "26"; // ~15% opacity
      g.appendChild(c);

      const label = el("text", {
        y: n.r + 11,
        "text-anchor": "middle"
      });
      label.textContent = n.name;
      g.appendChild(label);

      // self-loop badges
      if (selectedFlow && selfStepMap.has(n.id)) {
        selfStepMap.get(n.id).forEach((num, k) => {
          const bx = n.r + 8 + k * 16;
          const by = -n.r - 4;
          const bg = el("g", { transform: `translate(${bx}, ${by})` });
          bg.appendChild(el("circle", { r: 9, class: "badge-circle", fill: selectedFlow.color }));
          const t = el("text", { class: "badge-text", y: 0 });
          t.textContent = num;
          bg.appendChild(t);
          g.appendChild(bg);
        });
      }

      // drag
      attachDrag(g, n);
      // hover -> show details in tooltip area
      g.addEventListener("mouseenter", () => showNodeTooltip(n));
      g.addEventListener("mouseleave", hideNodeTooltip);
      gNodes.appendChild(g);
    }
  }

  function renderBadges() {
    gBadges.innerHTML = "";
    if (!selectedFlow) return;
    for (const [k, nums] of stepEdgeMap) {
      const [from, to] = k.split(">");
      const a = idMap.get(from), b = idMap.get(to);
      if (!a || !b) continue;
      // place badges along the edge, evenly spaced from the midpoint outward
      const total = nums.length;
      nums.forEach((num, j) => {
        const t = 0.55 + (j - (total - 1) / 2) * 0.08;
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const g = el("g", {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)})`,
          "data-step": num
        });
        g.appendChild(el("circle", { r: 10, class: "badge-circle", fill: selectedFlow.color }));
        const t2 = el("text", { class: "badge-text", y: 0 });
        t2.textContent = num;
        g.appendChild(t2);
        gBadges.appendChild(g);
      });
    }
  }

  function render() {
    renderEdges();
    renderNodes();
    renderBadges();
  }

  // --- helpers ------------------------------------------------------------
  function getCSSVar(maybeVar) {
    if (typeof maybeVar === "string" && maybeVar.startsWith("var(")) {
      const name = maybeVar.replace("var(", "").replace(")", "").trim();
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#666";
    }
    return maybeVar;
  }
  function hexFromVar(v) { return getCSSVar(v); }

  // --- drag ---------------------------------------------------------------
  let dragging = null;
  function attachDrag(g, n) {
    g.addEventListener("mousedown", ev => {
      dragging = { node: n, sx: ev.clientX, sy: ev.clientY, x0: n.x, y0: n.y, moved: false };
      ev.preventDefault();
    });
  }
  document.addEventListener("mousemove", ev => {
    if (!dragging) return;
    const pt = clientToViewBox(ev.clientX, ev.clientY);
    if (!pt) return;
    const pt0 = clientToViewBox(dragging.sx, dragging.sy);
    const node = dragging.node;
    node.x = dragging.x0 + (pt.x - pt0.x);
    node.y = dragging.y0 + (pt.y - pt0.y);
    node.x = Math.max(PADDING, Math.min(W - PADDING, node.x));
    node.y = Math.max(PADDING, Math.min(H - PADDING - 20, node.y));
    dragging.moved = true;
    render();
  });
  document.addEventListener("mouseup", () => { dragging = null; });

  function clientToViewBox(cx, cy) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const p = svg.createSVGPoint();
    p.x = cx; p.y = cy;
    const r = p.matrixTransform(ctm.inverse());
    return { x: r.x, y: r.y };
  }

  // --- node tooltip -------------------------------------------------------
  let tt = null;
  function showNodeTooltip(n) {
    hideNodeTooltip();
    tt = document.createElement("div");
    tt.style.cssText = "position:fixed;background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px 10px;font-size:11px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.08);pointer-events:none;z-index:10";
    tt.innerHTML = '<b style="font-size:12px">' + n.name + '</b>'
      + (n.file ? '<div style="font-family:ui-monospace,monospace;color:#777;font-size:10px;margin-top:2px">' + n.file + '</div>' : '')
      + '<div style="margin-top:6px;color:#444">' + (n.description || '') + '</div>';
    document.body.appendChild(tt);
    document.addEventListener("mousemove", moveTooltip);
  }
  function moveTooltip(ev) {
    if (!tt) return;
    tt.style.left = (ev.clientX + 12) + "px";
    tt.style.top  = (ev.clientY + 12) + "px";
  }
  function hideNodeTooltip() {
    if (tt) { tt.remove(); tt = null; document.removeEventListener("mousemove", moveTooltip); }
  }

  // --- sidebar: flow list + components ------------------------------------
  const flowList = document.getElementById("flow-list");
  data.flows.forEach(flow => {
    const b = document.createElement("button");
    b.className = "flow-btn";
    b.style.setProperty("--accent", flow.color);
    b.innerHTML =
      '<div class="name">' + flow.name + '</div>'
      + (flow.description ? '<div class="desc">' + flow.description + '</div>' : '');
    b.addEventListener("click", () => selectFlow(flow.id));
    b.dataset.flow = flow.id;
    flowList.appendChild(b);
  });

  // component count summary
  const counts = { external: 0, package: 0, "ERW stage": 0 };
  nodes.forEach(n => {
    if (n.kind === "stage") counts["ERW stage"]++;
    else counts[n.kind]++;
  });
  document.getElementById("component-summary").innerHTML =
    Object.entries(counts).map(([k, v]) => k + " — <b>" + v + "</b>").join("<br>")
    + '<br><br>Drag nodes to reposition. Click <i>Re-layout</i> to re-run the simulation.';

  // --- flow selection -----------------------------------------------------
  function selectFlow(id) {
    if (selectedFlow && selectedFlow.id === id) {
      // toggle off
      selectedFlow = null;
    } else {
      selectedFlow = data.flows.find(f => f.id === id);
    }
    document.querySelectorAll(".flow-btn").forEach(el => {
      el.classList.toggle("active", selectedFlow && el.dataset.flow === selectedFlow.id);
    });
    buildStepEdges(selectedFlow);
    render();
    renderStepList();
    document.getElementById("btn-clear").style.display = selectedFlow ? "inline-block" : "none";
  }

  // --- step list ----------------------------------------------------------
  function renderStepList() {
    const el = document.getElementById("steps");
    if (!selectedFlow) {
      el.innerHTML = '<div class="steps-empty">Select a workflow on the left to highlight its path through the components.</div>';
      return;
    }
    let html =
      '<div class="steps-head">'
      + '<span class="steps-title">' + selectedFlow.name + '</span>'
      + '<span class="steps-count">' + selectedFlow.steps.length + ' steps</span>'
      + '</div>';
    selectedFlow.steps.forEach((s, i) => {
      const from = idMap.get(s.from), to = idMap.get(s.to);
      html += '<div class="step" data-step="' + (i + 1) + '" style="--step-color:' + selectedFlow.color + '">'
        + '<div class="num">' + (i + 1) + '</div>'
        + '<div class="body">'
        +   '<div class="from-to"><b>' + (from ? from.name : s.from) + '</b>'
        +     '<span class="arrow">→</span><b>' + (to ? to.name : s.to) + '</b></div>'
        +   '<div class="passes">' + escapeHTML(s.passes || '') + '</div>'
        +   (s.note ? '<div class="note">' + escapeHTML(s.note) + '</div>' : '')
        + '</div>'
        + '</div>';
    });
    el.innerHTML = html;

    // hover sync: highlight corresponding edge / node
    el.querySelectorAll(".step").forEach(stepEl => {
      const num = parseInt(stepEl.dataset.step, 10);
      const step = selectedFlow.steps[num - 1];
      stepEl.addEventListener("mouseenter", () => flashStep(step, num));
      stepEl.addEventListener("mouseleave", unflashStep);
    });
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function flashStep(step, num) {
    if (step.from === step.to) {
      const nodeG = document.querySelector('.node[data-id="' + step.from + '"]');
      if (nodeG) nodeG.classList.add("flash");
    } else {
      const k = edgeKey(step.from, step.to);
      const line = document.querySelector('.edge[data-key="' + CSS.escape(k) + '"]');
      if (line) line.classList.add("flash");
      [step.from, step.to].forEach(id => {
        const g = document.querySelector('.node[data-id="' + id + '"]');
        if (g) g.classList.add("flash");
      });
    }
  }
  function unflashStep() {
    document.querySelectorAll(".flash").forEach(el => el.classList.remove("flash"));
  }

  // --- controls -----------------------------------------------------------
  document.getElementById("btn-reheat").addEventListener("click", () => {
    seedPositions();
    runSim(450);
    render();
  });
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (selectedFlow) selectFlow(selectedFlow.id);
  });

  // initial render
  render();
})();
</script>
</body>
</html>
